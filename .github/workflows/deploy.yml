name: Deploy MatFinder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            # Установка зависимостей (только первый раз)
            apt-get install -y ffmpeg python3-pip unzip screen 2>/dev/null || true
            
            # Клонируем или обновляем репозиторий
            if [ -d "/root/matfinder" ]; then
              cd /root/matfinder && git pull
            else
              git clone https://github.com/${{ github.repository }} /root/matfinder
              cd /root/matfinder
            fi

            # Вставляем секреты в main.py
            sed -i 's|ВАШ_ТОКЕН_БОТА|${{ secrets.TELEGRAM_TOKEN }}|g' main.py
            sed -i 's|ВАШ_CHAT_ID|${{ secrets.TELEGRAM_CHAT_ID }}|g' main.py

            # Устанавливаем Python зависимости
            pip3 install -r requirements.txt --quiet

            # Перезапускаем приложение
            screen -S matfinder -X quit 2>/dev/null || true
            sleep 1
            screen -dmS matfinder bash -c "cd /root/matfinder && uvicorn main:app --host 0.0.0.0 --port 8000 >> /root/matfinder.log 2>&1"

            echo "✅ Задеплоено успешно!"