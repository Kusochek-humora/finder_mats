name: Deploy MatFinder

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            # Клонируем или обновляем репозиторий
            if [ -d "/root/matfinder" ]; then
              cd /root/matfinder && git pull
            else
              git clone https://github.com/Kusochek-humora/finder_mats /root/matfinder
            fi

            # Устанавливаем зависимости
            pip3 install fastapi uvicorn python-multipart openai httpx --break-system-packages --quiet

            # Перезапускаем с секретами через env
            screen -S matfinder -X quit 2>/dev/null || true
            sleep 1
            screen -dmS matfinder bash -c "
              export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}'
              export TELEGRAM_TOKEN='${{ secrets.TELEGRAM_TOKEN }}'
              export TELEGRAM_CHAT_ID='${{ secrets.TELEGRAM_CHAT_ID }}'
              cd /root/matfinder
              uvicorn main:app --host 0.0.0.0 --port 8000 >> /root/matfinder.log 2>&1
            "
            echo "✅ Задеплоено!"